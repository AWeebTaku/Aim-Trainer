name: CI
on: [push, pull_request]
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - name: Headless smoke test
        env: { SDL_VIDEODRIVER: dummy, SDL_AUDIODRIVER: dummy }
        run: |
          python - <<'PY'
          import Shootit as S
          g = S.Game()
          for i in range(len(S.MODES)):
              for d in S.DIFFICULTIES:
                  g.sel, g.diff = i, d
                  g.start()
                  for _ in range(30000):  # perfect player; Classic never aims so it ends by losing lives
                      m, p = g.mode, g.mode.aim()
                      m.update(16, p)
                      if getattr(m, "phase", "go") != "wait":  # Reaction: click only once green
                          m.click(p)
                      m.draw()
                      if m.done: break
                  assert m.done, (type(m).__name__, d)
                  g.finish(); g.draw_over(); g.draw_menu()
          PY
