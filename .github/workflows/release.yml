name: Release
# Every push builds installers for all platforms (download from the run's Artifacts).
# Pushing a tag like v1.0.0 also publishes them as a GitHub Release.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to (re)attach these builds to, e.g. v1.0.0. Leave empty to only build."
        required: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: windows-x64, os: windows-latest }
          - { name: macos-arm64, os: macos-latest }
          - { name: macos-x64,   os: macos-15-intel }
          # built on the oldest runners so the binaries work on older glibc distros
          - { name: linux-x64,   os: ubuntu-22.04 }
          - { name: linux-arm64, os: ubuntu-22.04-arm }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }

      - name: Version from tag (0.0.1 for non-release builds)
        id: v
        shell: bash
        env: { TAG: "${{ inputs.tag || github.ref_name }}" }
        run: |
          V="${TAG#v}"; [[ "$V" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || V=0.0.1
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - run: pip install -r requirements.txt pyinstaller pillow

      # ---------------- Windows: setup.exe (current user) + msi ----------------
      - name: Build app (Windows)
        if: runner.os == 'Windows'
        run: pyinstaller --noconfirm --noconsole --name Aim-Trainer --icon assets/icon.png main.py
      - name: Installers (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install innosetup -y --no-progress
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DVersion=${{ steps.v.outputs.version }}" "/DOutName=Aim-Trainer-${{ matrix.name }}-setup" packaging\windows\aim-trainer.iss
          dotnet tool install --global wix --version 5.0.2
          wix build packaging\windows\Package.wxs -d "Version=${{ steps.v.outputs.version }}" -d "DistDir=${{ github.workspace }}\dist\Aim-Trainer" -o "Aim-Trainer-${{ matrix.name }}.msi"

      # ---------------- macOS: dmg ----------------
      - name: Build app and dmg (macOS)
        if: runner.os == 'macOS'
        run: |
          pyinstaller --noconfirm --windowed --name Aim-Trainer --icon assets/icon.png main.py
          mkdir dmg-stage && cp -R dist/Aim-Trainer.app dmg-stage/ && ln -s /Applications dmg-stage/Applications
          hdiutil create -volname Aim-Trainer -srcfolder dmg-stage -ov -format UDZO "Aim-Trainer-${{ matrix.name }}.dmg"

      # ---------------- Linux: deb, rpm, pkg.tar.zst, AppImage ----------------
      - name: Build app (Linux)
        if: runner.os == 'Linux'
        run: pyinstaller --noconfirm --name Aim-Trainer main.py
      - name: Packages (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y ruby rpm libarchive-tools zstd
          sudo gem install --no-document fpm

          # one staging tree shared by deb, rpm and pacman: app in /opt/aim-trainer, launcher at /usr/bin/aim-trainer
          stage=$(mktemp -d)
          install -d "$stage/opt" "$stage/usr/bin" "$stage/usr/share/applications" "$stage/usr/share/icons/hicolor/256x256/apps"
          cp -r dist/Aim-Trainer "$stage/opt/aim-trainer"
          ln -s /opt/aim-trainer/Aim-Trainer "$stage/usr/bin/aim-trainer"
          cp packaging/aim-trainer.desktop "$stage/usr/share/applications/"
          cp assets/icon.png "$stage/usr/share/icons/hicolor/256x256/apps/aim-trainer.png"
          for fmt in "deb deb" "rpm rpm" "pacman pkg.tar.zst"; do
            set -- $fmt
            fpm -s dir -t "$1" -n aim-trainer -v "${{ steps.v.outputs.version }}" -a native \
              --description "Arcade aim trainer" --url "https://github.com/${{ github.repository }}" \
              --license MIT --maintainer "${{ github.repository_owner }}" \
              -p "Aim-Trainer-${{ matrix.name }}.$2" -C "$stage" opt usr
          done

          # AppImage: runs on any distro
          AD=Aim-Trainer.AppDir
          mkdir -p "$AD/usr/lib" && cp -r dist/Aim-Trainer "$AD/usr/lib/aim-trainer"
          printf '#!/bin/sh\nHERE="$(dirname "$(readlink -f "$0")")"\nexec "$HERE/usr/lib/aim-trainer/Aim-Trainer" "$@"\n' > "$AD/AppRun"
          chmod +x "$AD/AppRun"
          cp packaging/aim-trainer.desktop "$AD/aim-trainer.desktop"
          cp assets/icon.png "$AD/aim-trainer.png" && ln -s aim-trainer.png "$AD/.DirIcon"
          curl -fsSL -o appimagetool "https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-$(uname -m).AppImage"
          chmod +x appimagetool
          ARCH=$(uname -m) ./appimagetool --appimage-extract-and-run "$AD" "Aim-Trainer-${{ matrix.name }}.AppImage"

      - uses: actions/upload-artifact@v4
        with:
          name: Aim-Trainer-${{ matrix.name }}
          path: Aim-Trainer-${{ matrix.name }}*

  release:
    if: startsWith(github.ref, 'refs/tags/v') || inputs.tag != ''
    needs: build
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/download-artifact@v4
        with: { path: artifacts, merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: artifacts/*
          generate_release_notes: true
