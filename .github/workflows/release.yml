name: Release
# Every push builds all platforms (download from the run's Artifacts).
# Pushing a tag like v1.0.0 also publishes them as a GitHub Release.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: windows-x64,  os: windows-latest }
          - { name: macos-arm64,  os: macos-latest }
          - { name: macos-x64,    os: macos-15-intel }
          # built on the oldest runner so the binary works on older glibc distros
          - { name: linux-x64,    os: ubuntu-22.04 }
          - { name: linux-arm64,  os: ubuntu-22.04-arm }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt pyinstaller
      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: |
          pyinstaller --onefile --noconsole --name Shootit Shootit.py
          Compress-Archive dist/Shootit.exe Shootit-${{ matrix.name }}.zip
      - name: Build (macOS)
        if: runner.os == 'macOS'
        run: |
          pyinstaller --windowed --name Shootit Shootit.py
          ditto -c -k --sequesterRsrc --keepParent dist/Shootit.app Shootit-${{ matrix.name }}.zip
      - name: Build (Linux)
        if: runner.os == 'Linux'
        run: |
          pyinstaller --onefile --name Shootit Shootit.py
          tar -czf Shootit-${{ matrix.name }}.tar.gz -C dist Shootit
      - uses: actions/upload-artifact@v4
        with:
          name: Shootit-${{ matrix.name }}
          path: Shootit-${{ matrix.name }}.*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/download-artifact@v4
        with: { path: artifacts, merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
